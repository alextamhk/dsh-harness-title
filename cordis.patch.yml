# harness-title bundle patch: inserts its plugin row into the web plugin roster.
# The single row mounts BOTH halves: the host side (settings namespace
# registration) and the browser side (the modules node half scans dsh.client
# packages into the web plugin roster, served from this package's lib/client.js).
- insert:
    - id: harness-title
      name: 'harness-title'
